<!DOCTYPE html>
<html>
<head><link rel="stylesheet" href="css/style.css"></head>
<body>
<div class="container">
<h2>Atendimento</h2>

<input id="nome" placeholder="Nome">
<input id="cpf" placeholder="CPF">

<select id="tipo">
  <option>Convenio</option>
  <option>Particular</option>
</select>

<input type="file" id="foto">

<button onclick="cadastrar()">Cadastrar</button>
</div>

<script>
function cadastrar(){
 fetch("http://localhost:3000/atendimento",{
  method:"POST",
  headers:{"Content-Type":"application/json"},
  body: JSON.stringify({
    "nome completo": nome.value,
    "CPF/RG ou outro documento": cpf.value,
    "sexo": sexo.value,
    "idade": idade.value,
    "Data de Nascimento": dataNascimento.value,
    "Nome da Mãe": nomeMae.value,
    "Estado Civil": estadoCivil.value,
    "Endereço": endereco.value,
    "Telefone": telefone.value,
    "E-mail": email.value,
    "Contato de emergencia": emergencia.value,
    "tipo": tipo.value
  })
 });
 alert("Paciente enviado para triagem");
}
</script>
</body>
</html>
